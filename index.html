<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablefly Studio — Websites that fill tables.</title>
<meta name="description" content="Tablefly Studio builds fast, beautiful websites for restaurants, cafés and food brands — digital menus, reservations, online ordering and local SEO. Free demo first: pay only if you like it.">
<link rel="icon" type="image/png" href="https://tablefly-studio.netlify.app/assets/tablefly-profile-icon-final.png">
<!-- No-JS / detection-failure fallback: if the script below cannot run,
     send the visitor to the Worldwide page after a short delay. -->
<meta http-equiv="refresh" content="3; url=worldwide/">
<script>
// Entry router (CEO correction, 7 Nov 2026): there is NO chooser screen.
// The visitor's market is detected silently and they land directly on
// their market page:
//   - a market previously chosen with the on-page switch is respected
//     (localStorage "tablefly-market");
//   - otherwise the device time zone decides: Asia/Kolkata or
//     Asia/Calcutta -> India, everything else -> Worldwide;
//   - language fallback: en-IN or Hindi -> India.
// Detection is approximate (VPN / travel can misroute) — every market
// page carries a visible India / Worldwide switch to correct it.
// "?choose=1" (the footer "Choose market again" link) simply re-runs
// fresh detection, ignoring the saved choice; it shows no UI either.
(function(){
  var dest = 'worldwide/';
  try{
    var rechoose = new URLSearchParams(location.search).has('choose');
    var saved = null;
    if(!rechoose){
      saved = localStorage.getItem('tablefly-market');
    }
    if(saved === 'india/' || saved === 'worldwide/'){
      dest = saved;
    }else{
      var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
      var lang = (navigator.language || '').toLowerCase();
      if(tz === 'Asia/Kolkata' || tz === 'Asia/Calcutta'){ dest = 'india/'; }
      else if(lang === 'en-in' || lang.indexOf('hi') === 0){ dest = 'india/'; }
      try{ localStorage.setItem('tablefly-market', dest); }catch(e){}
    }
  }catch(e){}
  location.replace(dest);
})();
</script>
<style>
  /* Minimal brand splash only — visible for the instant before redirect
     (or during the 3-second no-JS meta-refresh fallback). */
  html,body{margin:0;padding:0;background:#FFF6EA;}
  body{font-family:Georgia,'Times New Roman',serif;color:#3B2314;
       min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
  .splash{padding:24px;}
  .splash img{width:min(180px,50vw);height:auto;border-radius:22px;}
  .splash .name{font-size:1.6rem;font-weight:700;margin-top:14px;letter-spacing:.01em;}
  .splash .name em{font-style:normal;color:#E4572E;}
  .splash .tag{margin-top:4px;font-size:1rem;color:#E4572E;font-weight:600;}
</style>
</head>
<body>
  <main class="splash">
    <img src="https://tablefly-studio.netlify.app/assets/tablefly-logo-final.png" alt="Tablefly Studio" width="1568" height="1408">
    <div class="name">Tablefly <em>Studio</em></div>
    <div class="tag">Websites that fill tables.</div>
  </main>
</body>
</html>
